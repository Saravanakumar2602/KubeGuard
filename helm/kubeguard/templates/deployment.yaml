apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeguard.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubeguard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubeguard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeguard.selectorLabels" . | nindent 8 }}
    spec:
      {{- if and .Values.podSecurityContext .Values.podSecurityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.podSecurityContext.runAsNonRoot }}
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      {{- end }}
      containers:
      - name: prediction-service
        {{- if and .Values.securityContext .Values.securityContext.enabled }}
        securityContext:
          allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
          capabilities:
            drop:
            {{- toYaml .Values.securityContext.capabilities.drop | nindent 14 }}
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PROMETHEUS_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: PROMETHEUS_URL
        - name: MONITOR_NAMESPACES
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: MONITOR_NAMESPACES
        - name: MONITOR_INTERVAL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: MONITOR_INTERVAL_SECONDS
        - name: FEATURE_STORE_PATH
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: FEATURE_STORE_PATH
        - name: FEATURE_RETENTION_DAYS
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: FEATURE_RETENTION_DAYS
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: MODEL_PATH
        - name: MIN_TRAINING_SAMPLES
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: MIN_TRAINING_SAMPLES
        - name: MODEL_RETRAIN_INTERVAL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: MODEL_RETRAIN_INTERVAL_SECONDS
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: LOG_LEVEL
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: LOG_FORMAT
        - name: WORKER_HEALTH_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: WORKER_HEALTH_TIMEOUT_SECONDS
        - name: ALERTMANAGER_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: ALERTMANAGER_URL
        - name: INCIDENT_RESOLUTION_GRACE_SECONDS
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: INCIDENT_RESOLUTION_GRACE_SECONDS
        - name: INCIDENT_RETENTION_DAYS
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubeguard.fullname" . }}-config
              key: INCIDENT_RETENTION_DAYS

        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: data-volume
          mountPath: /data
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

      {{- if .Values.persistence.enabled }}
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: {{ include "kubeguard.fullname" . }}-pvc
      {{- end }}

