{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeguard.fullname" . }}-dashboard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubeguard.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  kubeguard-dashboard.json: |-
{{ .Files.Get "files/dashboard.json" | indent 4 }}
{{- end }}
