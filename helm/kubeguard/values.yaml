# Default values for kubeguard.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

namespace: kubeguard
createNamespace: false

replicaCount: 1

image:
  repository: kubeguard-prediction-service
  tag: "0.1.5"
  pullPolicy: IfNotPresent

logging:
  level: "INFO"
  format: "text"

worker:
  healthTimeoutSeconds: 90

incident:
  resolutionGraceSeconds: 120
  retentionDays: 30

alertmanager:
  url: "http://kube-prometheus-stack-alertmanager.monitoring.svc:9093"

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

monitoring:
  intervalSeconds: 30
  namespaces: "demo,kubeguard-test"

persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  featureStorePath: "/data/kubeguard.db"
  retentionDays: 7
  modelPath: "/data/kubeguard-isolation-forest.joblib"

model:
  minTrainingSamples: 50
  retrainIntervalSeconds: 3600

prometheus:
  url: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"

serviceMonitor:
  enabled: true
  interval: 15s

prometheusRule:
  enabled: true

grafanaDashboard:
  enabled: true


