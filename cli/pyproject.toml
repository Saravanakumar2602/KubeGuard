[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeguard-cli"
version = "0.1.0"
description = "KubeGuard AI — command-line interface for installation, inspection, and operation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
]

[project.scripts]
kubeguard = "kubeguard_cli.main:app_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["kubeguard_cli*"]
